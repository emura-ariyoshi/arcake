<head>
<!-- A-Frameを読み込む -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.2.0/aframe.min.js"></script>
<!-- AR.jsを読み込む -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ar.js/2.2.2/aframe-ar.min.js"></script>
<!-- aframe-extras読み込み -->
<script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
      <!-- glbのアニメーションを動かす機能「animation-mixer」を働かせるためにaframe-extras読み込みをする -->
</head>

<body style="margin : 0px; overflow: hidden;">
  <button id="toggleButton" style="position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 999; padding: 10px 20px; font-size: 16px; border: none; border-radius: 8px; background: #ffb703; color: #000; font-weight: bold;">音楽とアニメーション開始</button>
 <!-- AR.jsのデバックとA-FrameのVRボタンを非表示 -->
  <a-scene embedded arjs="debugUIEnabled: false;" renderer="colorManagement: true;" vr-mode-ui="enabled: false">
 
            <!-- a-sceneのところへ「embedded arjs」と入れないと、アスペクト比（縦横比）が狂います -->
             <!-- 「arjs="debugUIEnabled: false;"」を入れると、デバック用のUIが非表示になります -->
              <!-- 「renderer="colorManagement: true;"」を入れると、色の管理が有効になります -->
    <!-- マーカーが認識されたら -->
    <a-marker
      type="pattern" 
      preset="custom" 
      url="./pattern.patt"
      patternRatio="0.5">

      <!-- 画像を表示します -->
          <!-- ケーキのアニメーション -->
      <a-entity
          id="cake"
          gltf-model="url(./20260912cake.glb)"
          visible="false"
          position="0 0 0"
          rotation="-90 0 0"
          scale="0.2 0.2 0.2"></a-entity>
                <!-- 「animation-mixer」を追記します -->

         
                <!-- アニメーションがないファイルも「animation-mixer」を追記します。これがないと表示されません -->


      <!-- 音楽を流します -->
        <audio id="bgm" src="./HappyBirthday.wav" preload="auto" loop>
          あなたのブラウザーは <code>audio</code>要素をサポートしていません。
        </audio>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const toggleButton = document.getElementById('toggleButton');
    const bgm = document.getElementById('bgm');
    const cake = document.getElementById('cake');
    let isPlaying = false;

    function updateButtonLabel() {
      if (!toggleButton) return;
      toggleButton.textContent = isPlaying ? '音楽とアニメーション停止' : '音楽とアニメーション開始';
    }

    function toggleExperience() {
      isPlaying = !isPlaying;
      updateButtonLabel();

      if (bgm) {
        if (isPlaying) {
          bgm.volume = 0.7;
          bgm.currentTime = 0;
          bgm.play().catch(() => {});
        } else {
          bgm.pause();
          bgm.currentTime = 0;
        }
      }

      if (cake) {
        if (isPlaying) {
          cake.setAttribute('visible', true);
          cake.setAttribute('animation-mixer', {
            clip: '*',
            loop: 'repeat'
          });
        } else {
          cake.setAttribute('visible', false);
          cake.removeAttribute('animation-mixer');
        }
      }
    }

    if (toggleButton) {
      toggleButton.addEventListener('click', toggleExperience);
    }
  </script>
</body>
