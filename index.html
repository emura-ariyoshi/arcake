<head>
<!-- A-Frameを読み込む -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.2.0/aframe.min.js"></script>
<!-- AR.jsを読み込む -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ar.js/2.2.2/aframe-ar.min.js"></script>
<!-- aframe-extras読み込み -->
<script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
      <!-- glbのアニメーションを動かす機能「animation-mixer」を働かせるためにaframe-extras読み込みをする -->
</head>

<body style="margin: 0; overflow: hidden;">
  <button id="startMusic" style="position: fixed; left: 50%; top: 20px; transform: translateX(-50%); z-index: 999; display: block;">音楽を再生</button>

  <a-scene embedded arjs>
    <!-- a-sceneのところへ「embedded arjs」と入れないと、アスペクト比（縦横比）が狂います -->

    <!-- マーカーが認識されたら -->
    <a-marker type="pattern" preset="custom" url="./pattern.patt">
      <!-- 画像を表示します -->
      <!-- ケーキのアニメーション -->
      <a-entity
        gltf-model="url(./20260912cake.glb)"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
        animation-mixer>
      </a-entity>

      <!-- 音楽を流します -->
      <audio id="bgm" src="./HappyBirthday.wav" preload="auto" loop></audio>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const bgm = document.getElementById('bgm');
    const startMusicBtn = document.getElementById('startMusic');

    function playMusic() {
      if (!bgm) return;
      bgm.volume = 0.6;
      bgm.play().catch(() => {
        // ブラウザの自動再生制限により再生が拒否された場合は無視
      });
      if (startMusicBtn) {
        startMusicBtn.style.display = 'none';
      }
    }

    if (startMusicBtn) {
      startMusicBtn.addEventListener('click', playMusic);
    }

    document.addEventListener('pointerdown', playMusic, { once: true });
    document.addEventListener('touchstart', playMusic, { once: true });

    const marker = document.querySelector('a-marker');
    if (marker) {
      marker.addEventListener('markerFound', playMusic);
    }
  </script>
</body>
